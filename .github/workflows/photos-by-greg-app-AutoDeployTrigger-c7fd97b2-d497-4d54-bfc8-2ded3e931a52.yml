name: Trigger auto deployment for photos-by-greg-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/photos-by-greg-app-AutoDeployTrigger-c7fd97b2-d497-4d54-bfc8-2ded3e931a52.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PHOTOSBYGREGAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PHOTOSBYGREGAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PHOTOSBYGREGAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ca563b299433acr.azurecr.io
          registryUsername: ${{ secrets.PHOTOSBYGREGAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PHOTOSBYGREGAPP_REGISTRY_PASSWORD }}
          containerAppName: photos-by-greg-app
          resourceGroup: photos-by-greg-rg
          imageToBuild: ca563b299433acr.azurecr.io/photos-by-greg-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


